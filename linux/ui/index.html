<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Navigatueur</title>
<link rel="stylesheet" href="chrome.css" />
</head>
<body>
  <!-- Tab strip: pinned tabs, loose tabs, then one block per group. -->
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newtab" class="icon-btn" title="Nouvel onglet (Ctrl+T)">+</button>
    <div class="spacer"></div>
    <span id="memory" title="Mémoire utilisée"></span>
    <button id="savedgroups" class="icon-btn" title="Groupes enregistrés">&#9776;</button>
  </div>

  <div id="toolbar">
    <button class="icon-btn" id="back"    title="Précédent (Alt+&#8592;)">&#8249;</button>
    <button class="icon-btn" id="forward" title="Suivant (Alt+&#8594;)">&#8250;</button>
    <button class="icon-btn" id="reload"  title="Actualiser (F5)">&#10227;</button>
    <button class="icon-btn" id="home"    title="Accueil">&#8962;</button>

    <div id="addrwrap">
      <span id="shield" title="Protections actives"></span>
      <input id="address" type="text" spellcheck="false"
             placeholder="Rechercher ou saisir une adresse" />
    </div>

    <button class="icon-btn" id="findbtn"     title="Rechercher dans la page (Ctrl+F)">&#8981;</button>
    <button class="icon-btn" id="zoomout"     title="Zoom arrière (Ctrl+-)">&#8722;</button>
    <span   id="zoomlevel" title="Réinitialiser le zoom (Ctrl+0)">100%</span>
    <button class="icon-btn" id="zoomin"      title="Zoom avant (Ctrl++)">+</button>
    <button class="icon-btn" id="pip"         title="Picture-in-picture">&#9648;</button>
    <button class="icon-btn" id="translate"   title="Traduire en français">&#127760;</button>
    <button class="icon-btn" id="history"     title="Historique (Ctrl+H)">&#8634;</button>
    <button class="icon-btn" id="settings"    title="Paramètres">&#9881;</button>
  </div>

  <!-- Find-in-page bar, hidden until Ctrl+F. -->
  <div id="findbar" hidden>
    <input id="findinput" type="text" placeholder="Rechercher dans la page…" spellcheck="false" />
    <button class="icon-btn" id="findprev" title="Précédent">&#8593;</button>
    <button class="icon-btn" id="findnext" title="Suivant">&#8595;</button>
    <button class="icon-btn" id="findclose" title="Fermer">&#215;</button>
  </div>

  <div id="menu" class="menu" hidden></div>

<script src="chrome.js"></script>
</body>
</html>
