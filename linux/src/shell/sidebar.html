<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: navigatueur:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Onglets</title>
  <link rel="stylesheet" href="shell.css">
  <style>
    body { display: flex; }
    body.right { flex-direction: row-reverse; }
    #panel {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      overflow: hidden;
      flex: none;
    }
    body.right #panel { border-right: 0; border-left: 1px solid var(--panel-border); }
    #wallpaper { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.35; pointer-events: none; }
    #panel > * { position: relative; }
    header { height: 48px; display: flex; align-items: center; padding: 0 6px 0 16px; flex: none; }
    header h1 { font-size: 14px; font-weight: 600; margin: 0; }
    header .count { margin-left: 8px; padding: 1px 6px; border-radius: 6px; background: var(--surface); color: var(--text2); font-size: 11px; }
    header .spacer { flex: 1; }
    header .icon-btn.on { color: var(--accent); }
    #list { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 6px; }
    .row {
      position: relative;
      display: flex;
      align-items: center;
      height: 34px;
      margin: 1px 8px;
      padding: 0 2px 0 0;
      border-radius: 8px;
      color: var(--text2);
    }
    .row:hover { background: var(--surface-hover); }
    .row.active { background: var(--surface-active); color: var(--text); }
    .row.suspended .title { opacity: 0.6; }
    .row .fav { width: 34px; display: grid; place-items: center; flex: none; }
    .row .fav img { width: 16px; height: 16px; border-radius: 3px; }
    .row .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .marker { position: absolute; left: -6px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent); display: none; }
    body.right .row .marker { left: auto; right: -6px; }
    .row.active .marker { display: block; }
    .row .audio, .row .close { width: 26px; height: 26px; border-radius: 6px; display: none; place-items: center; color: var(--text2); flex: none; }
    .row .audio:hover, .row .close:hover { background: var(--surface-active); color: var(--text); }
    .row.audible .audio, .row.muted .audio { display: grid; }
    .row.muted .audio { color: var(--danger); }
    .row:hover .close, .row.active .close { display: grid; }
    .row .pin { width: 26px; display: grid; place-items: center; color: var(--text3); }
    .row:hover .pin, .row.active .pin { display: none; }
    .row.in-group { margin-left: 18px; }
    .row.in-group::before { content: ""; position: absolute; left: -8px; top: 4px; bottom: 4px; width: 2px; border-radius: 1px; background: var(--group-color); opacity: 0.8; }
    .row.drop-before::after, .row.drop-after::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 1px; background: var(--accent); }
    .row.drop-before::after { top: -2px; }
    .row.drop-after::after { bottom: -2px; }
    .row.drop-into { outline: 1.5px solid var(--accent); }
    .group-header { margin-top: 6px; color: var(--text); font-weight: 600; }
    .group-header .fav { color: var(--group-color); }
    .group-header .chev { width: 26px; display: grid; place-items: center; color: var(--text3); }
    .group-header input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--accent); color: var(--text); border-radius: 6px; padding: 3px 6px; font: inherit; outline: none; user-select: text; }
    .section { margin: 10px 18px 2px; color: var(--text3); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; }
    .newtab { display: flex; align-items: center; gap: 10px; margin: 2px 8px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--text2); }
    .newtab:hover { background: var(--surface-hover); color: var(--text); }
    .newtab .kbd { margin-left: auto; color: var(--text3); font-size: 11.5px; }
    footer { padding: 4px 0 10px; flex: none; }
    #grip { position: absolute; top: 0; bottom: 0; right: -3px; width: 6px; cursor: ew-resize; z-index: 3; }
    body.right #grip { right: auto; left: -3px; }
    #card {
      position: absolute;
      top: 0;
      width: 276px;
      display: none;
      overflow: hidden;
      pointer-events: none;
    }
    #card.open { display: block; }
    #card .shot { height: 155px; background-size: cover; background-position: top center; border-bottom: 1px solid var(--panel-border); }
    #card .body { padding: 10px 12px 11px; }
    #card .t { font-weight: 600; color: var(--text); max-height: 36px; overflow: hidden; }
    #card .h { color: var(--text2); font-size: 12px; margin-top: 5px; display: flex; gap: 7px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #card .h img { width: 14px; height: 14px; border-radius: 3px; }
    #card .s { color: var(--text3); font-size: 11.5px; margin-top: 5px; }
  </style>
</head>
<body>
  <div id="panel">
    <div id="wallpaper"></div>
    <header>
      <h1>Onglets</h1><span class="count" id="count">0</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="dockBtn" title="Garder la colonne affichée / masquée automatiquement"><span class="chip"></span></button>
      <button class="icon-btn" id="newBtn" title="Nouvel onglet (Ctrl+T)"><span class="chip"></span></button>
    </header>
    <div id="list" tabindex="-1"></div>
    <footer id="footer"></footer>
    <div id="grip"></div>
  </div>
  <div id="card" class="popup-card"></div>
  <script src="common.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
