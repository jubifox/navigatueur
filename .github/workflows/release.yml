# Publishes a GitHub release when a version tag is pushed — from the command
# line (git tag v0.18.0 && git push origin v0.18.0) or by creating the
# release in GitHub's web interface, which creates the tag.
#
#   v0.18.0       → official release, marked "latest": the built-in updater
#                   offers it to every installed copy.
#   v0.18.0-rc1   → pre-release: downloadable for testing, never offered by
#                   the updater (it only looks at the latest release).
#
# Before an official release, the version commit updates
# Navigatueur.App.csproj, installer/Navigatueur.iss, docs/releases/vX.Y.Z.md
# and the download links in README.md (section "Télécharger"); the first step
# checks all of them.
#
# The installer is built on Windows by packaging/windows/build-release.ps1.
# If the repository variable WEBVIEW2_CAB_URL points to a WebView2 "Fixed
# Version" x64 CAB, that engine is bundled into the installer; otherwise the
# app uses the system's WebView2 runtime.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check the tag matches the app version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-.+)?$') { throw "Unexpected tag format: $tag" }
          $version = $Matches[1]
          $prerelease = [bool]$Matches[2]
          $csproj = [xml](Get-Content src/Navigatueur.App/Navigatueur.App.csproj)
          $appVersion = ($csproj.Project.PropertyGroup | Where-Object Version).Version
          $issVersion = (Select-String -Path installer/Navigatueur.iss -Pattern '#define MyAppVersion "(.+)"').Matches[0].Groups[1].Value
          if ($appVersion -ne $version -or $issVersion -ne $version) {
            throw "Tag $tag, Navigatueur.App.csproj $appVersion and Navigatueur.iss $issVersion must agree."
          }
          $notes = "docs/releases/v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          if (-not $prerelease) {
            # The README's download links name the files of the latest official
            # release (pre-releases leave them alone).
            $readme = Get-Content README.md -Raw
            $section = [regex]::Match($readme, '(?ms)^## Télécharger\s*$.*?(?=^## )').Value
            $versions = @([regex]::Matches($section, '\d+\.\d+\.\d+') | ForEach-Object Value | Sort-Object -Unique)
            if ($versions.Count -ne 1 -or $versions[0] -ne $version) {
              throw "README.md, section Télécharger: links are for $($versions -join ', '), expected $version only."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease".ToLower() >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Download the WebView2 engine to bundle (optional)
        id: runtime
        if: vars.WEBVIEW2_CAB_URL != ''
        shell: pwsh
        run: |
          $cab = Join-Path $env:RUNNER_TEMP 'webview2-fixed.cab'
          Invoke-WebRequest '${{ vars.WEBVIEW2_CAB_URL }}' -OutFile $cab
          "cab=$cab" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          $arguments = @{}
          if ('${{ steps.runtime.outputs.cab }}') { $arguments.FixedRuntimeCab = '${{ steps.runtime.outputs.cab }}' }
          ./packaging/windows/build-release.ps1 @arguments

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "publish/installer/NavigatueurSetup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }

          $title = (Get-Content '${{ steps.version.outputs.notes }}' -TotalCount 1).TrimStart('#', ' ')
          $flags = @()
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') {
            $title = "$title (préversion)"
            $flags += '--prerelease'
          } else {
            $flags += '--latest'
          }

          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release was created from GitHub's web interface (which is what
            # created the tag): attach the installer and the notes to it.
            gh release upload $tag $installer --clobber
            gh release edit $tag --title $title --notes-file '${{ steps.version.outputs.notes }}' @flags
          } else {
            gh release create $tag $installer `
              --title $title `
              --notes-file '${{ steps.version.outputs.notes }}' `
              --target '${{ github.sha }}' @flags
          }

  # The Android APKs (one per processor type), attached to the same release
  # as the Windows installer. Signed with the key from the repository
  # secrets NAVIGATUEUR_KEYSTORE_B64 / NAVIGATUEUR_KEYSTORE_PASSWORD /
  # NAVIGATUEUR_KEY_ALIAS / NAVIGATUEUR_KEY_PASSWORD (see
  # packaging/android/set-signing-secrets.ps1); without them, with a
  # throwaway key (installable, but the next version won't install over it).
  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android platform the engine needs
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVIGATUEUR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NAVIGATUEUR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in the repository secrets: the APKs are signed with a throwaway key."
          fi

      - name: Build the release APKs
        working-directory: android
        env:
          NAVIGATUEUR_KEYSTORE_PASSWORD: ${{ secrets.NAVIGATUEUR_KEYSTORE_PASSWORD }}
          NAVIGATUEUR_KEY_ALIAS: ${{ secrets.NAVIGATUEUR_KEY_ALIAS }}
          NAVIGATUEUR_KEY_PASSWORD: ${{ secrets.NAVIGATUEUR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la android/app/build/outputs/apk/release/
          gh release upload '${{ github.ref_name }}' android/app/build/outputs/apk/release/Navigatueur-Android-*.apk --clobber

  # Navigatueur for Linux: the AppImage (updates itself from the release,
  # through latest-linux.yml) and a .deb, attached to the same release.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: linux/package-lock.json

      - name: Build the AppImage and the .deb
        working-directory: linux
        run: |
          npm ci
          npm test
          npm run dist

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la linux/dist/
          gh release upload '${{ github.ref_name }}' linux/dist/Navigatueur-Linux-*.AppImage linux/dist/Navigatueur-Linux-*.deb linux/dist/latest-linux.yml --clobber
