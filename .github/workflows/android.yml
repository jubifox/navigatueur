# Builds the Android app (GeckoView), runs its unit tests, then starts it on
# an emulator and screenshots a few steps (tests/android/smoke.sh). The
# screenshots are uploaded as the "android-captures" artifact.
name: Android

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "src/Navigatueur.App/Navigatueur.App.csproj"
      - "src/Navigatueur.App/Resources/Phishing/**"
      - "tests/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "tests/android/**"
  workflow_dispatch:

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android platform the engine needs
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build the APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  smoke:
    name: Real app on an emulator (screenshots)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/android/smoke.sh apk captures

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-captures
          path: captures
          retention-days: 14

      # The same screenshots on a throwaway branch, so they can be viewed
      # straight from the repository (raw.githubusercontent.com), like the
      # Windows captures. Pull requests (possibly from forks) don't publish.
      - name: Publish screenshots to ci/android-captures
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d captures ] || exit 0
          cd captures
          if [ -f logcat.txt ]; then tail -n 3000 logcat.txt > logcat-fin.txt; rm logcat.txt; fi
          echo "Captures Android — run $GITHUB_RUN_ID, commit $GITHUB_SHA ($GITHUB_REF_NAME)" > README.md
          git init -q -b ci/android-captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android smoke captures for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci/android-captures
